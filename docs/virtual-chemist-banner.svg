<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Virtual Chemist molecule illustration</title>
  <desc id="description">Pastel atom orbits and molecule cards on a warm cream background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#f4edff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#1d1b2f" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <circle cx="1100" cy="28" r="95" fill="#ffd35c" opacity=".35"/>
  <circle cx="44" cy="318" r="115" fill="#8fe3b5" opacity=".32"/>
  <path d="M75 74h370" stroke="#1d1b2f" stroke-width="3" stroke-linecap="round" opacity=".12"/>
  <rect x="76" y="106" width="220" height="40" rx="20" fill="#8fe3b5" stroke="#1d1b2f" stroke-width="2"/>
  <text x="186" y="132" text-anchor="middle" fill="#1d1b2f" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">A PLAYFUL CHEMISTRY LAB</text>
  <text x="76" y="207" fill="#1d1b2f" font-family="Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="-1">CONNECT. COMBINE.</text>
  <text x="76" y="267" fill="#1d1b2f" font-family="Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="-1">DISCOVER MOLECULES.</text>
  <text x="79" y="306" fill="#6b6880" font-family="Arial, sans-serif" font-size="18">Drag atoms together and see what chemistry creates.</text>
  <g transform="translate(886 181)" fill="none" stroke="#1d1b2f" stroke-width="3">
    <ellipse rx="186" ry="68" transform="rotate(-32)" opacity=".72"/>
    <ellipse rx="186" ry="68" transform="rotate(32)" opacity=".72"/>
    <ellipse rx="186" ry="68" opacity=".72"/>
  </g>
  <g filter="url(#shadow)" stroke="#1d1b2f" stroke-width="3">
    <circle cx="886" cy="181" r="48" fill="#ffd35c"/>
    <circle cx="886" cy="181" r="20" fill="#fff8ec"/>
    <circle cx="758" cy="87" r="27" fill="#ff9db8"/>
    <circle cx="1059" cy="90" r="27" fill="#7cc4ff"/>
    <circle cx="1056" cy="274" r="27" fill="#b9a2ff"/>
    <circle cx="724" cy="259" r="27" fill="#8fe3b5"/>
  </g>
  <g fill="#1d1b2f" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="758" y="94">H</text>
    <text x="1059" y="97">O</text>
    <text x="1056" y="281">C</text>
    <text x="724" y="266">N</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="955" y="143" width="112" height="48" rx="16" fill="#fff" stroke="#1d1b2f" stroke-width="2"/>
    <text x="1011" y="174" text-anchor="middle" fill="#1d1b2f" font-family="Arial, sans-serif" font-size="21" font-weight="800">H₂O</text>
  </g>
</svg>
